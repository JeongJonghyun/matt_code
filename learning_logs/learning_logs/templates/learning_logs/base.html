<style>
    .menu-btn {
        display: inline-block;
        padding: 8px 18px;
        margin: 5px 5px 5px 0;
        background-color: #2980b9;
        color: #fff;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        font-size: 1em;
        transition: background 0.2s;
    }
    .menu-btn:hover {
        background-color: #1c5d8c;
    }
    .menu-bar {
        display: flex;
        justify-content: center;   /* 버튼을 수평 가운데 정렬 */
        align-items: center;       /* 버튼을 수직 가운데 정렬 (필요시) */
        margin-bottom: 20px;
        gap: 50px;                 /* 버튼 사이 간격 */
        min-height: 100px;          /* 필요시 높이 조절 */
    }
</style>
<p class="menu-bar">
    <a href="{% url 'learning_logs:index' %}" class="menu-btn">처음 페이지</a>
    <a href="{% url 'learning_logs:topics' %}" class="menu-btn">홈페이지 입장</a>
</p>

{% block content %}{% endblock content %}
